<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #020617;
        --panel: #0f172a;
        --panel-strong: #111827;
        --border: rgba(148, 163, 184, 0.2);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #8b5cf6;
        --primary-strong: #7c3aed;
        --success: #22c55e;
        --danger: #94a3b8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #020617, #111827);
        color: var(--text);
      }

      h1, h2, h3 {
        font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }

      h1, h2, h3, p { margin-top: 0; }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
        gap: 16px;
        flex-wrap: wrap;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .header a,
      .logout-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--text);
        text-decoration: none;
        border: 1px solid var(--border);
        padding: 10px 18px;
        border-radius: 999px;
        line-height: 1;
        height: 42px;
      }

      .logout-form {
        margin: 0;
      }

      .logout-btn {
        width: auto;
        margin: 0;
        background: rgba(255, 255, 255, 0.08);
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .logout-btn:hover {
        background: rgba(255, 255, 255, 0.14);
        transform: translateY(-1px);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
      }

      .panel {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 18px 30px rgba(2, 6, 23, 0.35);
      }

      label {
        display: block;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      input, textarea, button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 12px 14px;
        margin-top: 8px;
        font: inherit;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      input, textarea {
        background: rgba(15, 23, 42, 0.7);
        color: var(--text);
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      button {
        cursor: pointer;
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: white;
        border: none;
        font-weight: 700;
        transition: transform 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .secondary {
        background: rgba(255, 255, 255, 0.08);
      }

      .danger {
        background: rgba(148, 163, 184, 0.12);
        border-color: rgba(148, 163, 184, 0.4);
        color: var(--text);
      }

      .stack {
        display: grid;
        gap: 16px;
      }

      .project-item,
      .message-item {
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.75);
        border-radius: 12px;
        padding: 16px;
        margin-top: 12px;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .row button {
        width: auto;
        flex: 1 1 auto;
        min-width: 130px;
      }

      .status {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(34, 197, 94, 0.12);
        color: #bbf7d0;
        border: 1px solid rgba(34, 197, 94, 0.25);
        display: none;
      }

      .status.visible {
        display: block;
      }

      .muted {
        color: var(--muted);
      }

      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
        margin-top: 8px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: auto;
        margin: 0;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.7);
        cursor: pointer;
        font-size: 0.9rem;
      }

      .checkbox-item input {
        width: auto;
        margin: 0;
        accent-color: var(--primary);
      }

      .checkbox-item img {
        width: 18px;
        height: 18px;
      }

      .current-hero-preview {
        margin-top: 10px;
      }

      .current-hero-preview img {
        width: 100%;
        max-height: 160px;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Portfolio Admin Panel</h1>
        <div class="header-actions">
          <a href="/">Back to Portfolio</a>
          <form method="POST" action="/api/admin/logout" class="logout-form">
            <button type="submit" class="logout-btn">Log Out</button>
          </form>
        </div>
      </div>

      <div class="grid">
        <section class="panel">
          <h2>Profile</h2>
          <form id="profile-form" class="stack">
            <label>
              Name
              <input type="text" id="profile-name" name="name" required />
            </label>
            <label>
              Title
              <input type="text" id="profile-title" name="title" required />
            </label>
            <label>
              Description
              <textarea id="profile-description" name="description" required></textarea>
            </label>
            <label>
              Email
              <input type="email" id="profile-email" name="email" required />
            </label>
            <label>
              Phone
              <input type="text" id="profile-phone" name="phone" required />
            </label>
            <label>
              Location
              <input type="text" id="profile-location" name="location" required />
            </label>
            <label>
              GitHub
              <input type="url" id="profile-github" name="github" required />
            </label>
            <button type="submit">Update Profile</button>
          </form>
          <div id="profile-status" class="status"></div>
        </section>

        <section class="panel">
          <h2>CV</h2>
          <form id="cv-form" class="stack" enctype="multipart/form-data">
            <label>
              Select CV file
              <input type="file" name="cvFile" accept=".pdf,.doc,.docx" required />
            </label>
            <button type="submit">Upload CV</button>
          </form>
          <div id="cv-status" class="status"></div>
          <div class="project-item" id="cv-preview">
            <p class="muted">No CV uploaded yet.</p>
          </div>
        </section>
      </div>

      <div class="grid" style="margin-top: 24px;">
        <section class="panel">
          <h2>Add Project</h2>
          <form id="project-form" class="stack" enctype="multipart/form-data">
            <label>
              Title
              <input type="text" name="title" id="project-title" required />
            </label>
            <label>
              Tag
              <input type="text" name="tag" id="project-tag" />
            </label>
            <label>
              Description
              <textarea name="description" id="project-description" required></textarea>
            </label>
            <label>
              Project image file
              <input type="file" name="projectImage" accept="image/*" />
            </label>
            <label>
              Image URL (optional if no file)
              <input type="text" name="image" id="project-image" />
            </label>
            <label>
              Link URL
              <input type="text" name="link" id="project-link" />
            </label>
            <button type="submit" id="project-submit-btn">Upload Project</button>
          </form>
          <div id="project-status" class="status"></div>
        </section>

        <section class="panel">
          <h2>Homepage</h2>
          <form id="homepage-form" class="stack" enctype="multipart/form-data">
            <label>
              Hero image file
              <input type="file" name="homepageImage" accept="image/*" />
            </label>
            <div id="current-hero-preview" class="current-hero-preview"></div>

            <label>Tech stacks</label>
            <div id="tech-stack-checkboxes" class="checkbox-grid"></div>

            <button type="submit">Save homepage</button>
          </form>
          <div id="homepage-status" class="status"></div>
        </section>

        <section class="panel">
          <h2>Manage Project</h2>
          <form id="project-manage-form" class="stack">
            <label>
              Select project
              <select id="project-select" name="projectSelect">
                <option value="">Choose a project</option>
              </select>
            </label>

            <label>
              Title
              <input type="text" name="managedTitle" id="managed-title" />
            </label>
            <label>
              Tag
              <input type="text" name="managedTag" id="managed-tag" />
            </label>
            <label>
              Description
              <textarea name="managedDescription" id="managed-description"></textarea>
            </label>
            <label>
              Image URL
              <input type="text" name="managedImage" id="managed-image" />
            </label>
            <label>
              Link URL
              <input type="text" name="managedLink" id="managed-link" />
            </label>

            <div class="row">
              <button type="button" id="update-project-btn" class="secondary">Update Selected</button>
              <button type="button" id="delete-project-btn" class="danger">Delete Selected</button>
              <button type="button" id="cancel-project-edit" class="secondary">Cancel</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <h2>Messages</h2>
          <div id="messages-list" class="stack"></div>
        </section>
      </div>
    </div>

    <script>
      const profileForm = document.getElementById('profile-form');
      const cvForm = document.getElementById('cv-form');
      const projectForm = document.getElementById('project-form');
      const homepageForm = document.getElementById('homepage-form');
      const projectSubmitBtn = document.getElementById('project-submit-btn');
      const cancelProjectEditBtn = document.getElementById('cancel-project-edit');
      const updateProjectBtn = document.getElementById('update-project-btn');
      const deleteProjectBtn = document.getElementById('delete-project-btn');
      const projectSelect = document.getElementById('project-select');
      const currentHeroPreview = document.getElementById('current-hero-preview');
      const techStackCheckboxes = document.getElementById('tech-stack-checkboxes');

      const TECH_STACK_CATALOG = [
        { name: 'HTML', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg' },
        { name: 'CSS', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg' },
        { name: 'JavaScript', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg' },
        { name: 'Python', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg' },
        { name: 'MySQL', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg' },
        { name: 'C++', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/cplusplus/cplusplus-original.svg' },
        { name: 'PHP', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/php/php-original.svg' },
        { name: 'Git', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg' },
        { name: 'GitHub', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg' },
        { name: 'Java', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg' },
        { name: 'React', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg' },
        { name: 'Tailwind CSS', image: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tailwindcss/tailwindcss-original.svg' }
      ];

      function renderTechStackCheckboxes(selectedNames) {
        techStackCheckboxes.innerHTML = TECH_STACK_CATALOG.map((tech, index) => `
          <label class="checkbox-item">
            <input type="checkbox" value="${index}" ${selectedNames.includes(tech.name) ? 'checked' : ''} />
            <img src="${tech.image}" alt="" />
            <span>${tech.name}</span>
          </label>
        `).join('');
      }

      function getSelectedTechStacks() {
        return Array.from(techStackCheckboxes.querySelectorAll('input[type="checkbox"]:checked'))
          .map((input) => TECH_STACK_CATALOG[Number(input.value)]);
      }
      const managedTitle = document.getElementById('managed-title');
      const managedTag = document.getElementById('managed-tag');
      const managedDescription = document.getElementById('managed-description');
      const managedImage = document.getElementById('managed-image');
      const managedLink = document.getElementById('managed-link');
      const messagesList = document.getElementById('messages-list');
      const cvPreview = document.getElementById('cv-preview');

      function showStatus(elementId, message, isError = false) {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.classList.add('visible');
        el.style.background = isError ? 'rgba(148, 163, 184, 0.12)' : 'rgba(34, 197, 94, 0.12)';
        el.style.color = isError ? '#e2e8f0' : '#bbf7d0';
        el.style.borderColor = isError ? 'rgba(148, 163, 184, 0.25)' : 'rgba(34, 197, 94, 0.25)';
      }

      function resetProjectForm() {
        projectForm.reset();
        projectForm.dataset.editingId = '';
        projectSubmitBtn.textContent = 'Upload Project';
        if (projectSelect) {
          projectSelect.value = '';
        }
        if (managedTitle) managedTitle.value = '';
        if (managedTag) managedTag.value = '';
        if (managedDescription) managedDescription.value = '';
        if (managedImage) managedImage.value = '';
        if (managedLink) managedLink.value = '';
      }

      function fillProjectForm(project) {
        if (managedTitle) managedTitle.value = project.title || '';
        if (managedTag) managedTag.value = project.tag || '';
        if (managedDescription) managedDescription.value = project.description || '';
        if (managedImage) managedImage.value = project.image || '';
        if (managedLink) managedLink.value = project.link || '';

        if (projectSelect) {
          projectSelect.value = project.id;
        }

        projectForm.dataset.editingId = project.id;
      }

      async function loadProfile() {
        try {
          const response = await fetch('/api/profile');
          const profile = await response.json();

          if (!response.ok) {
            throw new Error(profile.detail || profile.error || `Server returned ${response.status}`);
          }

          document.getElementById('profile-name').value = profile.name || '';
          document.getElementById('profile-title').value = profile.title || '';
          document.getElementById('profile-description').value = profile.description || '';
          document.getElementById('profile-email').value = profile.email || '';
          document.getElementById('profile-phone').value = profile.phone || '';
          document.getElementById('profile-location').value = profile.location || '';
          document.getElementById('profile-github').value = profile.github || '';

          renderCv(profile.cv);
        } catch (error) {
          console.error('Failed to load profile:', error);
          showStatus('profile-status', `Could not load profile (${error.message}). Check the server/database connection.`, true);
        }
      }

      function renderCv(cv) {
        if (!cv || !cv.url) {
          cvPreview.innerHTML = '<p class="muted">No CV uploaded yet.</p>';
          return;
        }

        cvPreview.innerHTML = `
          <strong>${cv.fileName || 'CV File'}</strong>
          <p><a href="${cv.url}" target="_blank" rel="noopener noreferrer" style="color:#c4b5fd;">Open CV</a></p>
        `;
      }

      async function loadProjects() {
        try {
          const response = await fetch('/api/projects');
          const projects = await response.json();

          if (!response.ok) {
            throw new Error(projects.detail || projects.error || `Server returned ${response.status}`);
          }

          if (!projectSelect) return;

          projectSelect.innerHTML = '<option value="">Choose a project</option>' + projects.map((project) => `
            <option value="${project.id}">${project.title}</option>
          `).join('');

          if (!projects.length) {
            resetProjectForm();
            return;
          }

          if (projectForm.dataset.editingId) {
            const selectedProject = projects.find((project) => project.id === projectForm.dataset.editingId);
            if (selectedProject) {
              fillProjectForm(selectedProject);
            }
          }
        } catch (error) {
          console.error('Failed to load projects:', error);
          showStatus('project-status', `Could not load projects (${error.message}).`, true);
        }
      }

      async function loadHomepageSettings() {
        try {
          const response = await fetch('/api/homepage');
          const homepage = await response.json();

          if (!response.ok) {
            throw new Error(homepage.detail || homepage.error || `Server returned ${response.status}`);
          }

          currentHeroPreview.innerHTML = homepage.heroImage
            ? `<img src="${homepage.heroImage}" alt="Current hero image" />`
            : '<p class="muted">No hero image set yet.</p>';

          const selectedNames = (homepage.techStacks || []).map((stack) => stack.name);
          renderTechStackCheckboxes(selectedNames);
        } catch (error) {
          console.error('Failed to load homepage settings:', error);
          showStatus('homepage-status', `Could not load homepage settings (${error.message}).`, true);
        }
      }

      async function loadMessages() {
        try {
          const response = await fetch('/api/messages');
          const messages = await response.json();

          if (!response.ok) {
            throw new Error(messages.detail || messages.error || `Server returned ${response.status}`);
          }

          if (!messages.length) {
            messagesList.innerHTML = '<p class="muted">No messages yet.</p>';
            return;
          }

          messagesList.innerHTML = messages.map((message) => `
            <article class="message-item">
              <h3>${message.name}</h3>
              <p class="muted">${message.email}</p>
              <p>${message.message}</p>
              <div class="row">
                <button class="danger" data-message-id="${message.id}" type="button">Delete</button>
              </div>
            </article>
          `).join('');

          messagesList.querySelectorAll('[data-message-id]').forEach((button) => {
            button.addEventListener('click', async () => {
              await fetch(`/api/messages/${button.dataset.messageId}`, { method: 'DELETE' });
              loadMessages();
            });
          });
        } catch (error) {
          console.error('Failed to load messages:', error);
          messagesList.innerHTML = `<p class="muted">Could not load messages (${error.message}).</p>`;
        }
      }

      profileForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(profileForm);
        const profile = Object.fromEntries(formData.entries());

        const response = await fetch('/api/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(profile)
        });

        if (response.ok) {
          showStatus('profile-status', 'Profile updated successfully.');
          loadProfile();
        } else {
          const error = await response.json().catch(() => ({}));
          showStatus('profile-status', error.detail || error.error || `Failed to update profile (server returned ${response.status}).`, true);
        }
      });

      cvForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(cvForm);

        const response = await fetch('/api/cv', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          const cv = await response.json();
          renderCv(cv);
          showStatus('cv-status', 'CV uploaded successfully.');
          cvForm.reset();
        } else {
          showStatus('cv-status', 'CV upload failed.', true);
        }
      });

      homepageForm?.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(homepageForm);
        formData.append('techStacks', JSON.stringify(getSelectedTechStacks()));

        const response = await fetch('/api/homepage', {
          method: 'PUT',
          body: formData
        });

        if (response.ok) {
          showStatus('homepage-status', 'Homepage updated successfully.');
          await loadHomepageSettings();
        } else {
          const error = await response.json().catch(() => ({}));
          showStatus('homepage-status', error.error || 'Homepage update failed.', true);
        }
      });

      projectForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(projectForm);
        const editingId = projectForm.dataset.editingId;
        const url = editingId ? `/api/projects/${editingId}` : '/api/projects';
        const method = editingId ? 'PUT' : 'POST';

        const response = await fetch(url, {
          method,
          body: formData
        });

        if (response.ok) {
          showStatus('project-status', editingId ? 'Project updated successfully.' : 'Project uploaded successfully.');
          resetProjectForm();
          loadProjects();
        } else {
          const errors = await response.json();
          showStatus('project-status', errors.error || 'Project operation failed.', true);
        }
      });

      cancelProjectEditBtn.addEventListener('click', () => {
        resetProjectForm();
      });

      if (projectSelect) {
        projectSelect.addEventListener('change', async () => {
          const selectedId = projectSelect.value;
          if (!selectedId) {
            resetProjectForm();
            return;
          }

          const response = await fetch('/api/projects');
          const projects = await response.json();
          const selectedProject = projects.find((project) => project.id === selectedId);

          if (selectedProject) {
            fillProjectForm(selectedProject);
          }
        });
      }

      updateProjectBtn.addEventListener('click', async () => {
        const id = projectForm.dataset.editingId || projectSelect.value;
        if (!id) {
          showStatus('project-status', 'Select a project to update.', true);
          return;
        }

        const formData = new FormData();
        formData.append('title', managedTitle.value);
        formData.append('tag', managedTag.value);
        formData.append('description', managedDescription.value);
        formData.append('image', managedImage.value);
        formData.append('link', managedLink.value);

        const response = await fetch(`/api/projects/${id}`, {
          method: 'PUT',
          body: formData
        });

        if (response.ok) {
          showStatus('project-status', 'Project updated successfully.');
          resetProjectForm();
          loadProjects();
        } else {
          const error = await response.json();
          showStatus('project-status', error.error || 'Failed to update project.', true);
        }
      });

      deleteProjectBtn.addEventListener('click', async () => {
        const id = projectForm.dataset.editingId || projectSelect.value;
        if (!id) {
          showStatus('project-status', 'Select a project to delete.', true);
          return;
        }

        const response = await fetch(`/api/projects/${id}`, { method: 'DELETE' });
        if (response.ok) {
          showStatus('project-status', 'Project deleted successfully.');
          resetProjectForm();
          loadProjects();
        } else {
          const error = await response.json();
          showStatus('project-status', error.error || 'Failed to delete project.', true);
        }
      });

      loadProfile();
      loadHomepageSettings();
      loadMessages();
      loadProjects();
    </script>
  </body>
</html>
